<!doctype html><html lang="en"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>Lecture Attendance</title><style>
:root{font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;color:#17253c;background:#f5f7fb}*{box-sizing:border-box}body{margin:0}button,input,select,textarea{font:inherit}button{cursor:pointer}.app{max-width:1160px;margin:auto;padding:26px 20px 60px}.top{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:24px}.brand{display:flex;align-items:center;gap:13px}.logo{background:#173a72;color:white;border-radius:14px;padding:12px;font-size:22px}.sub{font-size:13px;color:#738099}.tiny{font-size:12px;color:#738099}.title{font-size:27px;font-weight:800;margin:0}.nav{display:flex;gap:6px;flex-wrap:wrap;margin:22px 0}.nav button{background:transparent;border:0;color:#64728b;border-radius:9px;padding:10px 16px}.nav button.active{background:#e5edff;color:#194789;font-weight:700}.btn{background:#2557ad;color:#fff;border:1px solid #2557ad;border-radius:9px;padding:10px 15px;font-weight:650}.btn.secondary{background:white;color:#234978;border-color:#cbd7e7}.btn.danger{background:#fff3f3;color:#a93439;border-color:#f2bfc0}.btn:disabled{opacity:.5;cursor:not-allowed}.btn.small{padding:6px 10px;font-size:13px}.panel{background:white;border:1px solid #e0e6ef;border-radius:16px;padding:22px;margin-bottom:18px;box-shadow:0 3px 12px #243d6209}.panel h2{margin:0 0 15px;font-size:19px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.stats{margin:16px 0}.stat{padding:18px;background:#fff;border:1px solid #e1e7f0;border-radius:14px}.stat strong{display:block;font-size:26px;margin-top:6px}.row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.space{justify-content:space-between}.muted{color:#6b788d}.field{display:flex;flex-direction:column;gap:6px;flex:1;min-width:185px}.field label{font-weight:650;font-size:13px}input,select,textarea{width:100%;border:1px solid #cad4e2;border-radius:9px;padding:10px 11px;background:white;color:#1b2d47}input[type=checkbox]{width:19px;height:19px;accent-color:#2557ad;cursor:pointer}textarea{min-height:95px}table{border-collapse:collapse;width:100%}th{text-align:left;color:#68768e;font-size:12px;text-transform:uppercase;letter-spacing:.03em;padding:12px 10px;background:#f8fafd}td{border-top:1px solid #edf0f5;padding:11px 10px;font-size:14px}tr:hover td{background:#fafcff}.scroll{overflow-x:auto}.pill{display:inline-block;border-radius:999px;padding:4px 10px;font-size:12px;font-weight:750;background:#eef2f7;color:#59697e}.pill.yes{background:#e4f5e9;color:#177448}.pill.no{background:#fff0ed;color:#b14b32}.alert{background:#fff7df;border:1px solid #f0dca5;padding:12px;border-radius:10px;font-size:13px}.hint{background:#ecf5ff;border:1px solid #d4e7ff;padding:12px;border-radius:10px;font-size:13px}.sectionactions{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}.empty{text-align:center;padding:46px 15px;color:#708099}.hidden{display:none!important}.modalback{position:fixed;inset:0;background:#071629aa;display:grid;place-items:center;padding:20px;z-index:5}.modal{max-width:700px;width:100%;max-height:90vh;overflow:auto;background:white;border-radius:16px;padding:24px;box-shadow:0 14px 70px #06112450}.preview{background:#f8fafd;border:1px solid #e2e7ef;padding:15px;border-radius:10px;white-space:pre-wrap;font-size:14px;line-height:1.65}.toast{position:fixed;bottom:20px;right:20px;background:#1f3759;color:white;border-radius:10px;padding:12px 18px;z-index:9;max-width:380px}.checkcell{display:flex;align-items:center;gap:10px}.footer{padding:20px 0;color:#79869b;font-size:12px}.progress{padding:10px 0;color:#2557ad;font-weight:650}@media(max-width:700px){.grid{grid-template-columns:1fr}.top{align-items:flex-start}.title{font-size:23px}.panel{padding:16px}.app{padding:16px 12px 36px}td,th{padding:10px 7px}}
</style></head><body><div class="app"><div class="top"><div class="brand"><div class="logo">✓</div><div><h1 class="title">Lecture Attendance</h1><div class="sub">Courses · students · records · Outlook email</div></div></div><span class="pill" id="accountStatus">Demo / offline</span></div><div class="nav" id="nav"><button data-tab="attendance" class="active">Attendance</button><button data-tab="courses">Courses & students</button><button data-tab="history">History & exports</button><button data-tab="email">Email center</button><button data-tab="settings">Microsoft 365 settings</button></div><main id="view"></main><div class="footer">Records are stored in this browser on this device. Export backups regularly. For shared or institutional use, replace local storage with approved secure university storage.</div></div><div id="modalMount"></div><div id="toast" class="toast hidden"></div><script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script><script src="https://alcdn.msauth.net/browser/2.38.3/js/msal-browser.min.js"></script><script>
'use strict';
const KEY='attendance_app_v2';const empty=()=>({courses:[],lectures:[],settings:{clientId:'',tenantId:'',sendPresent:true,sendAbsent:true,signature:'Course instructor'}});
let db;try{db={...empty(),...JSON.parse(localStorage.getItem(KEY)||'{}')}}catch{db=empty()};
let selectedCourse='',selectedLecture='',currentTab='attendance',search='',appAuth=null,account=null,sending=false;
const $=(s)=>document.querySelector(s),uid=()=>crypto.randomUUID?crypto.randomUUID():String(Date.now()+Math.random()),esc=(v)=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),today=()=>new Date().toLocaleDateString('en-CA'),save=()=>localStorage.setItem(KEY,JSON.stringify(db));
const course=()=>db.courses.find(x=>x.id===selectedCourse),lecture=()=>db.lectures.find(x=>x.id===selectedLecture),clectures=(id)=>db.lectures.filter(l=>l.courseId===id).sort((a,b)=>b.date.localeCompare(a.date));
function toast(x){$('#toast').textContent=x;$('#toast').classList.remove('hidden');setTimeout(()=>$('#toast')?.classList.add('hidden'),4000)}
function navigate(tab){currentTab=tab;document.querySelectorAll('#nav button').forEach(x=>x.classList.toggle('active',x.dataset.tab===tab));render()}
$('#nav').onclick=e=>{const b=e.target.closest('button[data-tab]');if(b)navigate(b.dataset.tab)};
function courseSelect(id='courseSelect'){return `<select id="${id}">${db.courses.map(c=>`<option value="${c.id}" ${c.id===selectedCourse?'selected':''}>${esc(c.name)}</option>`).join('')}</select>`}
function header(t,extra=''){return `<div class="row space"><h2>${t}</h2>${extra}</div>`}
function render(){if(!db.courses.some(x=>x.id===selectedCourse))selectedCourse=db.courses[0]?.id||'';if(!db.lectures.some(x=>x.id===selectedLecture&&x.courseId===selectedCourse))selectedLecture=clectures(selectedCourse)[0]?.id||'';$('#accountStatus').textContent=account?'Connected: '+(account.username||account.name):'Demo / offline';({attendance:renderAttendance,courses:renderCourses,history:renderHistory,email:renderEmail,settings:renderSettings}[currentTab]||renderAttendance)()}
function renderAttendance(){
 const c=course(),l=lecture();
 if(!c){$('#view').innerHTML='<div class="panel empty"><h2>No courses yet</h2><p>Create a course to get started.</p><button class="btn" onclick="navigate(\'courses\')">Create course</button></div>';return;}
 const present=l?c.students.filter(s=>l.marks[s.id]===true).length:0;
 const options=clectures(c.id).map(x=>`<option value="${x.id}" ${x.id===selectedLecture?'selected':''}>${esc(x.date)} — ${esc(x.title)}</option>`).join('');
 const summary=l?`<div class="grid stats"><div class="stat"><span class="muted">Students</span><strong>${c.students.length}</strong></div><div class="stat"><span class="muted">Present</span><strong>${present}</strong></div><div class="stat"><span class="muted">Absent</span><strong>${c.students.length-present}</strong></div></div>`:'';
 const checklist=l?`<div class="panel"><h2>Student checklist <span class="pill">Autosaved</span></h2><div class="row space"><div class="field"><label>Find student</label><input id="studentSearch" placeholder="Search name, ID or email" value="${esc(search)}"></div><div class="sectionactions"><button class="btn secondary small" onclick="setAll(true)">Mark all present</button><button class="btn secondary small" onclick="setAll(false)">Mark all absent</button></div></div><div class="scroll"><table><thead><tr><th>Present</th><th>Name</th><th>Student ID</th><th>Email</th></tr></thead><tbody id="studentRows"></tbody></table></div><div class="sectionactions"><button class="btn" onclick="navigate('email')">Review emails</button><button class="btn secondary" onclick="exportAttendees()">Download attendees CSV</button><button class="btn secondary" onclick="exportLectureAll()">Download full attendance CSV</button></div></div>`:'<div class="panel empty">No lectures yet. Choose a date and click + New.</div>';
 $('#view').innerHTML=`<div class="panel"><h2>Take attendance</h2><div class="row"><div class="field"><label>Course</label>${courseSelect()}</div><div class="field"><label>Lecture</label><select id="lectureSelect">${options}</select></div><div class="field"><label>New lecture date</label><div class="row" style="flex-wrap:nowrap"><input type="date" id="newDate" value="${today()}"><button class="btn" onclick="newLecture()">+ New</button></div></div></div></div>${summary}${checklist}`;
 $('#courseSelect').onchange=e=>{selectedCourse=e.target.value;selectedLecture='';search='';render()};
 if(l){$('#lectureSelect').onchange=e=>{selectedLecture=e.target.value;render()};$('#studentSearch').oninput=e=>{search=e.target.value;renderStudentRows()};renderStudentRows()}
}
function renderStudentRows(){const c=course(),l=lecture();if(!c||!l)return;$('#studentRows').innerHTML=c.students.filter(s=>[s.name,s.studentId,s.email].some(x=>String(x||'').toLowerCase().includes(search.toLowerCase()))).sort((a,b)=>a.name.localeCompare(b.name)).map(s=>`<tr><td><input aria-label="Present ${esc(s.name)}" type="checkbox" data-student="${s.id}" ${l.marks[s.id]?'checked':''}></td><td><strong>${esc(s.name)}</strong></td><td>${esc(s.studentId)}</td><td>${esc(s.email)}</td></tr>`).join('')||'<tr><td colspan="4">No students found</td></tr>';$('#studentRows').onchange=e=>{if(e.target.matches('[data-student]')){l.marks[e.target.dataset.student]=e.target.checked;l.updatedAt=new Date().toISOString();save();renderAttendance()}}}
function newLecture(){const c=course();if(!c)return;const date=$('#newDate').value;if(!date)return alert('Select a date');let title=prompt('Lecture title (optional):','Lecture');if(title===null)return;const l={id:uid(),courseId:c.id,date,title:title.trim()||'Lecture',marks:{},sent:{},updatedAt:new Date().toISOString()};db.lectures.push(l);selectedLecture=l.id;save();render();toast('Lecture created. Students default to absent.')}
function setAll(v){const l=lecture(),c=course();if(!l||!c)return;if(!confirm(`Mark ALL ${c.students.length} students ${v?'present':'absent'}?`))return;c.students.forEach(s=>l.marks[s.id]=v);save();render()}
function renderCourses(){const c=course();$('#view').innerHTML=`<div class="panel">${header('Course management')}<div class="row"><div class="field"><label>New course name</label><input id="courseName" placeholder="e.g. Urban Hydrology 2026"></div><button class="btn" onclick="addCourse()">+ Add course</button></div></div>${c?`<div class="panel">${header('Students & roster',`<span class="pill">${c.students.length} students</span>`)}<div class="row"><div class="field"><label>Selected course</label>${courseSelect()}</div><button class="btn danger small" onclick="deleteCourse()">Delete course</button></div><div class="hint" style="margin-top:16px">Import <b>.xlsx, .xls or .csv</b> with headers such as <b>Name, Student ID, Email</b>. Hebrew headers (שם, תעודת זהות / מספר סטודנט, דואר אלקטרוני) are supported. Existing students with the same ID or email are updated rather than duplicated.</div><div class="sectionactions"><label class="btn" style="cursor:pointer">Import Excel / CSV<input type="file" id="fileInput" accept=".xlsx,.xls,.csv" style="display:none"></label><button class="btn secondary" onclick="downloadTemplate()">Download CSV template</button><button class="btn secondary" onclick="exportRoster()">Export roster</button></div><div class="row"><div class="field"><label>Student name</label><input id="addName" placeholder="Student name"></div><div class="field"><label>Student ID</label><input id="addId" placeholder="Optional"></div><div class="field"><label>Email address</label><input id="addEmail" placeholder="student@university.ac.il"></div><button class="btn secondary" onclick="addStudent()">Add student</button></div><div class="scroll" style="margin-top:16px"><table><thead><tr><th>Name</th><th>Student ID</th><th>Email</th><th></th></tr></thead><tbody>${c.students.map(s=>`<tr><td>${esc(s.name)}</td><td>${esc(s.studentId)}</td><td>${esc(s.email)}</td><td><button class="btn danger small" onclick="removeStudent('${s.id}')">Remove</button></td></tr>`).join('')}</tbody></table></div></div>`:''}`;if(c){$('#courseSelect').onchange=e=>{selectedCourse=e.target.value;selectedLecture='';render()};$('#fileInput').onchange=importStudents}}
function addCourse(){const name=$('#courseName').value.trim();if(!name)return alert('Enter a course name');const c={id:uid(),name,students:[]};db.courses.push(c);selectedCourse=c.id;selectedLecture='';save();render()}
function deleteCourse(){const c=course();if(!confirm(`Delete "${c.name}" and ALL its lecture history? This cannot be undone.`))return;db.courses=db.courses.filter(x=>x.id!==c.id);db.lectures=db.lectures.filter(l=>l.courseId!==c.id);selectedCourse='';selectedLecture='';save();render()}
const emailValid=x=>/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(x);
function addStudent(){const name=$('#addName').value.trim(),studentId=$('#addId').value.trim(),email=$('#addEmail').value.trim();if(!name||!emailValid(email))return alert('A name and valid email are required');upsertStudents([{name,studentId,email}]);render()}
function upsertStudents(students){let added=0,updated=0;const c=course();for(const s of students){const found=c.students.find(x=>(s.studentId&&x.studentId===s.studentId)||(s.email&&x.email.toLowerCase()===s.email.toLowerCase()));if(found){Object.assign(found,s);updated++}else{c.students.push({...s,id:uid()});added++}}save();toast(`${added} student(s) added, ${updated} updated`)}
function removeStudent(id){if(!confirm('Remove this student from the course?'))return;course().students=course().students.filter(s=>s.id!==id);save();render()}
function norm(h){return String(h||'').trim().toLowerCase().replace(/[\s_\-().]/g,'')}
function getField(obj,aliases){const keys=Object.keys(obj),key=keys.find(k=>aliases.some(a=>norm(k)===norm(a)))||keys.find(k=>aliases.some(a=>norm(k).includes(norm(a))));return key?String(obj[key]??'').trim():''}
function importRows(rows){const imported=[],errors=[];rows.forEach((r,i)=>{const name=getField(r,['Name','Student Name','Full Name','שם','שם מלא','שם הסטודנט']),studentId=getField(r,['Student ID','ID','Student Number','מספר סטודנט','תעודת זהות','מספר זהות','תז']),email=getField(r,['Email','E-mail','Mail','Email Address','דוא"ל','דואר אלקטרוני','מייל']);if(!name&&!email&&!studentId)return;if(!name||!emailValid(email)){errors.push(i+2);return}imported.push({name,studentId,email})});if(imported.length)upsertStudents(imported);if(errors.length)alert(`Skipped ${errors.length} row(s) with missing name or invalid email. Spreadsheet row numbers: ${errors.slice(0,12).join(', ')}`);render()}
async function importStudents(e){const file=e.target.files[0];if(!file)return;try{let rows;if(window.XLSX){const b=await file.arrayBuffer(),wb=XLSX.read(b,{type:'array'});rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{defval:''})}else if(file.name.toLowerCase().endsWith('.csv')){rows=csvObjects(await file.text())}else throw Error('Excel parser not loaded. Connect to internet or convert the file to CSV.');importRows(rows)}catch(err){alert('Import failed: '+err.message)}}
function csvParse(text){let rows=[],row=[],cell='',q=false;for(let i=0;i<text.length;i++){const ch=text[i];if(ch==='"'){if(q&&text[i+1]==='"'){cell+='"';i++}else q=!q}else if(ch===','&&!q){row.push(cell);cell=''}else if((ch==='\n'||ch==='\r')&&!q){if(ch==='\r'&&text[i+1]==='\n')i++;row.push(cell);if(row.some(x=>x.length))rows.push(row);row=[];cell=''}else cell+=ch}row.push(cell);if(row.some(x=>x.length))rows.push(row);return rows}
function csvObjects(t){const a=csvParse(t.replace(/^\uFEFF/,'')),h=a.shift()||[];return a.map(r=>Object.fromEntries(h.map((k,i)=>[k,r[i]??''])))}
function csvDownload(name,rows){const csv='\uFEFF'+rows.map(row=>row.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\r\n');const blob=new Blob([csv],{type:'text/csv;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1200)}
const safe=x=>String(x||'').replace(/[^\w\-]+/g,'_').slice(0,55);
function downloadTemplate(){csvDownload('students_template.csv',[['Name','Student ID','Email'],['Dana Cohen','123456','dana@example.edu']])}
function exportRoster(){const c=course();if(c)csvDownload(safe(c.name)+'_roster.csv',[['Name','Student ID','Email'],...c.students.map(s=>[s.name,s.studentId,s.email])])}
function summaryRows(l,onlyPresent){const c=db.courses.find(x=>x.id===l.courseId);return [['Course','Date','Lecture','Student Name','Student ID','Email','Attendance'],...c.students.filter(s=>!onlyPresent||l.marks[s.id]).map(s=>[c.name,l.date,l.title,s.name,s.studentId,s.email,l.marks[s.id]?'Present':'Absent'])]}
function exportAttendees(l=lecture()){if(l)csvDownload('attendees_'+safe(courseById(l.courseId).name)+'_'+l.date+'.csv',summaryRows(l,true))}
function exportLectureAll(l=lecture()){if(l)csvDownload('attendance_'+safe(courseById(l.courseId).name)+'_'+l.date+'.csv',summaryRows(l,false))}
function courseById(id){return db.courses.find(c=>c.id===id)}
function renderHistory(){const lectures=[...db.lectures].sort((a,b)=>b.date.localeCompare(a.date));$('#view').innerHTML=`<div class="panel">${header('Attendance history')}<p class="muted">Download the attendees-only list or the full present/absent register for each lecture.</p><div class="sectionactions"><button class="btn secondary" onclick="backup()">Backup all data (JSON)</button><button class="btn danger" onclick="clearHistory()">Clear all lecture history</button><label class="btn secondary" style="cursor:pointer">Restore backup<input id="restoreFile" type="file" accept=".json" style="display:none"></label></div><div class="scroll"><table><thead><tr><th>Date</th><th>Course</th><th>Lecture</th><th>Present / Total</th><th>Export</th></tr></thead><tbody>${lectures.map(l=>{const c=courseById(l.courseId);if(!c)return '';return `<tr><td>${esc(l.date)}</td><td>${esc(c.name)}</td><td>${esc(l.title)}</td><td>${c.students.filter(s=>l.marks[s.id]).length} / ${c.students.length}</td><td><div class="row"><button class="btn secondary small" onclick="historyExport('${l.id}',true)">Attendees</button><button class="btn secondary small" onclick="historyExport('${l.id}',false)">All</button><button class="btn secondary small" onclick="openLecture('${l.id}')">Open</button><button class="btn danger small" onclick="deleteLecture('${l.id}')">Delete</button></div></td></tr>`}).join('')}</tbody></table></div>${!lectures.length?'<div class="empty">No lectures recorded yet.</div>':''}</div>`;$('#restoreFile').onchange=restore}
function historyExport(id,only){const l=db.lectures.find(x=>x.id===id);if(!l)return;only?exportAttendees(l):exportLectureAll(l)}
function openLecture(id){const l=db.lectures.find(x=>x.id===id);selectedCourse=l.courseId;selectedLecture=id;navigate('attendance')}
function deleteLecture(id){
 const l=db.lectures.find(x=>x.id===id);if(!l)return;
 const c=courseById(l.courseId);
 if(!confirm(`Permanently delete the lecture "${l.title}" (${l.date}) from ${c?.name||'this course'}? Attendance marks and email send records for this lecture will also be deleted. This cannot be undone.`))return;
 db.lectures=db.lectures.filter(x=>x.id!==id);
 if(selectedLecture===id)selectedLecture='';
 save();render();toast('Lecture deleted');
}
function clearHistory(){
 if(!db.lectures.length){toast('No lecture history to clear');return;}
 const n=db.lectures.length;
 if(!confirm(`Delete ALL ${n} lecture records across ALL courses? Student rosters and course settings will be kept. This cannot be undone.`))return;
 if(!confirm('Final confirmation: permanently erase all lecture attendance and associated email send history? Export a backup first if needed.'))return;
 db.lectures=[];selectedLecture='';save();render();toast('All lecture history cleared');
}
function backup(){const blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='attendance_backup_'+today()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
async function restore(e){const f=e.target.files[0];if(!f)return;try{const x=JSON.parse(await f.text());if(!Array.isArray(x.courses)||!Array.isArray(x.lectures))throw Error('Invalid backup');if(!confirm('Replace ALL existing records with this backup?'))return;db={...empty(),...x};save();render();toast('Backup restored')}catch(err){alert(err.message)}}
function emailSubject(l){return `Attendance confirmation — ${courseById(l.courseId).name} — ${l.date}`}
function emailBody(s,l){const c=courseById(l.courseId),status=l.marks[s.id]?'PRESENT':'ABSENT';return `Dear ${s.name},\n\nYour attendance for ${c.name}, ${l.title}, on ${l.date} has been recorded as: ${status}.\n\nIf you believe this is incorrect, please contact your course instructor.\n\nBest regards,\n${db.settings.signature||'Course instructor'}`}
function eligible(c,l){return c.students.filter(s=>emailValid(s.email)&&(l.marks[s.id]?db.settings.sendPresent:db.settings.sendAbsent))}
function renderEmail(){const c=course(),l=lecture();if(!c||!l){$('#view').innerHTML='<div class="panel empty">Create a course and lecture before emailing.</div>';return}const recipients=eligible(c,l),sent=recipients.filter(s=>l.sent?.[s.id]?.status==='sent').length;$('#view').innerHTML=`<div class="panel">${header('Personalized attendance emails')}<div class="row"><div class="field"><label>Course</label>${courseSelect()}</div><div class="field"><label>Lecture</label><select id="lectureSelect">${clectures(c.id).map(x=>`<option value="${x.id}" ${x.id===selectedLecture?'selected':''}>${esc(x.date)} — ${esc(x.title)}</option>`).join('')}</select></div></div><p class="muted">Subject: ${esc(emailSubject(l))}</p><div class="row"><label class="checkcell"><input type="checkbox" id="sendPresent" ${db.settings.sendPresent?'checked':''}> Email present students</label><label class="checkcell"><input type="checkbox" id="sendAbsent" ${db.settings.sendAbsent?'checked':''}> Email absent students</label></div><div class="grid stats"><div class="stat"><span class="muted">Eligible recipients</span><strong>${recipients.length}</strong></div><div class="stat"><span class="muted">Previously sent</span><strong>${sent}</strong></div><div class="stat"><span class="muted">Not yet sent</span><strong>${recipients.length-sent}</strong></div></div><div class="hint">Messages are sent <b>individually</b>. Students cannot see each other's addresses. Existing successful sends are skipped unless you explicitly choose to resend.</div><div class="scroll" style="margin-top:16px"><table><thead><tr><th>Student</th><th>Attendance</th><th>Email</th><th>Send status</th><th>Preview</th></tr></thead><tbody>${recipients.map(s=>`<tr><td>${esc(s.name)}</td><td><span class="pill ${l.marks[s.id]?'yes':'no'}">${l.marks[s.id]?'Present':'Absent'}</span></td><td>${esc(s.email)}</td><td>${esc(l.sent?.[s.id]?.status||'Not sent')}</td><td><button class="btn secondary small" onclick="previewStudent('${s.id}')">Preview</button></td></tr>`).join('')}</tbody></table></div><div class="sectionactions"><button class="btn" onclick="confirmSend(false)" ${!recipients.length||sending?'disabled':''}>Review & send unsent emails</button><button class="btn secondary" onclick="confirmSend(true)" ${!recipients.length||sending?'disabled':''}>Review & resend all</button><button class="btn secondary" onclick="navigate('settings')">Configure Outlook</button></div><div id="sendProgress" class="progress"></div></div>`;$('#courseSelect').onchange=e=>{selectedCourse=e.target.value;selectedLecture='';render()};$('#lectureSelect').onchange=e=>{selectedLecture=e.target.value;render()};for(const x of ['sendPresent','sendAbsent'])$('#'+x).onchange=e=>{db.settings[x]=e.target.checked;save();render()}}
function popup(content){$('#modalMount').innerHTML=`<div class="modalback" id="modalback"><div class="modal">${content}</div></div>`;$('#modalback').onclick=e=>{if(e.target.id==='modalback')closePopup()}}
function closePopup(){ $('#modalMount').innerHTML=''}
function previewStudent(id){const s=course().students.find(x=>x.id===id),l=lecture();popup(`<h2>Email preview</h2><p><b>To:</b> ${esc(s.email)}</p><p><b>Subject:</b> ${esc(emailSubject(l))}</p><div class="preview">${esc(emailBody(s,l))}</div><div class="sectionactions"><button class="btn secondary" onclick="closePopup()">Close</button></div>`)}
function confirmSend(resend){const c=course(),l=lecture(),recipients=eligible(c,l).filter(s=>resend||l.sent?.[s.id]?.status!=='sent');if(!recipients.length){toast('No unsent messages');return}popup(`<h2>Confirm email sending</h2><div class="alert"><b>${account?'Live Microsoft 365 mode':'Demo mode (no email will be sent)'}</b><p>You are about to ${account?'send':'simulate sending'} ${recipients.length} individual message(s) for <b>${esc(c.name)}</b> on ${esc(l.date)}.${resend?' This includes previously sent messages.':''}</p></div><p>Recipient example: <b>${esc(recipients[0].email)}</b></p><div class="preview">${esc(emailBody(recipients[0],l))}</div><div class="sectionactions"><button class="btn secondary" onclick="closePopup()">Cancel</button><button class="btn" onclick="sendBatch(${resend})">${account?'Confirm and send':'Run demo (no emails)'}</button></div>`)}
async function sendBatch(resend){if(sending)return;sending=true;closePopup();const c=course(),l=lecture(),people=eligible(c,l).filter(s=>resend||l.sent?.[s.id]?.status!=='sent');let done=0,failed=0;let token=null;if(account){try{token=await getToken()}catch(err){sending=false;alert('Microsoft sign-in/permission error: '+err.message);render();return}}for(const s of people){$('#sendProgress')&&($('#sendProgress').textContent=`Processing ${done+failed+1} / ${people.length}...`);try{if(token){const resp=await fetch('https://graph.microsoft.com/v1.0/me/sendMail',{method:'POST',headers:{Authorization:'Bearer '+token,'Content-Type':'application/json'},body:JSON.stringify({message:{subject:emailSubject(l),body:{contentType:'Text',content:emailBody(s,l)},toRecipients:[{emailAddress:{address:s.email}}]},saveToSentItems:true})});if(!resp.ok)throw Error('HTTP '+resp.status+' '+(await resp.text()).slice(0,250));l.sent=l.sent||{};l.sent[s.id]={status:'sent',at:new Date().toISOString(),attendance:l.marks[s.id]?'Present':'Absent'};}else{l.demoSent=l.demoSent||{};l.demoSent[s.id]={at:new Date().toISOString(),status:'simulated'}}done++}catch(err){failed++;l.sent=l.sent||{};l.sent[s.id]={status:'failed',at:new Date().toISOString(),error:err.message}}save()}sending=false;render();toast(account?`${done} sent; ${failed} failed.`:`Demo finished: ${done} simulated, no emails sent.`)}
function renderSettings(){$('#view').innerHTML=`<div class="panel">${header('Microsoft 365 / Outlook setup')}<div class="hint">Your university administrator may need to approve an app registration with delegated <b>Mail.Send</b> access. No password or client secret is stored in this app.</div><div class="row" style="margin-top:16px"><div class="field"><label>Application (client) ID</label><input id="clientId" placeholder="Microsoft Entra application client ID" value="${esc(db.settings.clientId)}"></div><div class="field"><label>Directory (tenant) ID</label><input id="tenantId" placeholder="University tenant ID" value="${esc(db.settings.tenantId)}"></div></div><div class="field" style="margin-top:12px"><label>Instructor email signature</label><input id="signature" value="${esc(db.settings.signature)}"></div><div class="sectionactions"><button class="btn secondary" onclick="saveSettings()">Save settings</button><button class="btn" onclick="connectMicrosoft()">Sign in with university Outlook</button>${account?'<button class="btn danger" onclick="disconnectMicrosoft()">Sign out</button>':''}</div><p class="muted">Current redirect URI to register as a <b>Single-page application (SPA)</b>:</p><div class="preview">${esc(location.origin+location.pathname)}</div><p class="tiny">For this self-contained edition, MSAL 2.x uses this page as its popup redirect. Run the app over localhost or HTTPS. The OAuth permission requested is Mail.Send (delegated). Some universities require IT administrator consent.</p><p class="tiny">If popup sign-in is blocked in Safari, try Chrome or Edge on a computer. The rest of the application works without signing in.</p></div><div class="panel"><h2>Storage & privacy</h2><p>Attendance records are saved only in the browser's localStorage, not in a server database. They may be lost if browsing data is cleared and are not synchronized between devices. Export JSON backups from History. Do not use this version as the university's permanent system of record without institutional security review.</p></div>`}
function saveSettings(){const changed=$('#clientId').value.trim()!==db.settings.clientId||$('#tenantId').value.trim()!==db.settings.tenantId;db.settings.clientId=$('#clientId').value.trim();db.settings.tenantId=$('#tenantId').value.trim();db.settings.signature=$('#signature').value.trim();save();if(changed){appAuth=null;account=null}toast('Settings saved');render()}
async function authInstance(){if(!window.msal)throw Error('Microsoft sign-in library unavailable. Check internet connection.');if(!db.settings.clientId||!db.settings.tenantId)throw Error('Save your university application and tenant IDs first.');if(!appAuth)appAuth=new msal.PublicClientApplication({auth:{clientId:db.settings.clientId,authority:'https://login.microsoftonline.com/'+db.settings.tenantId,redirectUri:location.origin+location.pathname},cache:{cacheLocation:'sessionStorage'}});return appAuth}
async function connectMicrosoft(){try{const a=await authInstance();const result=await a.loginPopup({scopes:['Mail.Send'],prompt:'select_account'});account=result.account;a.setActiveAccount(account);render();toast('Signed in as '+account.username)}catch(err){alert('Microsoft sign-in failed: '+err.message)}}
async function getToken(){const a=await authInstance();if(!account)throw Error('Not signed in');try{return (await a.acquireTokenSilent({scopes:['Mail.Send'],account})).accessToken}catch{return (await a.acquireTokenPopup({scopes:['Mail.Send'],account})).accessToken}}
async function disconnectMicrosoft(){try{if(appAuth&&account)await appAuth.logoutPopup({account,mainWindowRedirectUri:location.href})}catch{}account=null;render()}
(async()=>{if(db.settings.clientId&&db.settings.tenantId&&window.msal){try{const a=await authInstance();const accounts=a.getAllAccounts();if(accounts.length){account=accounts[0];a.setActiveAccount(account)}}catch{}}render()})();
</script></body></html>
